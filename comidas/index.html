<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Comidas</title><style>:root{color-scheme:dark;--b:#0b0b0c;--c:#141416;--c2:#1a1a1d;--l:#29292e;--t:#f5f5f7;--m:#929299}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:22px 13px 105px}h1{margin:0;font-size:34px;letter-spacing:-1.5px}.range{color:var(--m);font-size:13px;margin:5px 0 20px}.label{font-size:11px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:0 2px 8px}.weeks,.days,.stores{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin-bottom:16px}.weeks::-webkit-scrollbar,.days::-webkit-scrollbar,.stores::-webkit-scrollbar{display:none}button{font:inherit}.week,.day,.store-btn{border:1px solid var(--l);background:var(--c);color:var(--m)}.week,.store-btn{flex:none;height:44px;padding:0 14px;border-radius:999px;font-weight:750}.week.active{background:var(--t);color:#111}.store-btn{min-width:126px}.store-btn.active{background:#232328;color:#fff;border-color:#5a5a64}.day{flex:none;width:62px;height:66px;border-radius:14px;font-weight:800}.day.active{color:var(--t);border-color:#555}.day small{display:block;font-size:10px;text-transform:uppercase}.day b{font-size:20px}.date{font-size:20px;font-weight:800;margin:3px 2px 12px}.meals{display:grid;gap:10px}.meal,.group{background:var(--c);border:1px solid var(--l);border-radius:18px}.meal{padding:17px}.meal h2{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin:0 0 5px}.meal h3{font-size:21px;margin:0 0 12px}.ingredient{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--l);padding:10px 0;font-size:15px}.ingredient span:last-child{font-weight:800;white-space:nowrap}.shop-head{margin-bottom:12px}.shop-head strong{display:block;font-size:20px}.shop-head span{display:block;margin-top:3px;color:var(--m);font-size:12px}.shopping{display:grid;gap:10px}.group{overflow:hidden}.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--m);padding:14px 14px 8px;margin:0}.shop{display:grid;grid-template-columns:24px 78px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:100px;padding:11px 12px;border-top:1px solid var(--l)}.shop input{width:21px;height:21px;accent-color:white}.photo{width:78px;height:78px;border-radius:14px;overflow:hidden;background:#202024;border:1px solid #303036}.photo img{width:100%;height:100%;object-fit:cover;display:block}.name{font-size:14px;font-weight:850;line-height:1.2}.product{font-size:12px;color:#bbb;margin-top:4px;line-height:1.25}.store{display:inline-block;margin-top:7px;padding:4px 7px;border:1px solid #37373d;border-radius:999px;color:#c5c5ca;font-size:10px;font-weight:800}.qty{font-size:13px;font-weight:900;text-align:right;white-space:nowrap;align-self:start}.done .name{text-decoration:line-through}.done .name,.done .product,.done .store,.done .qty{color:#555}.progress{color:var(--m);font-size:13px;margin:0 2px 12px}.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:1px solid var(--l);background:#18181bef;border-radius:18px;backdrop-filter:blur(12px)}.nav button{height:50px;border:0;border-radius:13px;background:transparent;color:var(--m);font-weight:800}.nav button.active{background:var(--t);color:#111}.hidden{display:none}@media(min-width:700px){.shopping{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><h1 id="title">Comidas</h1><div class="range" id="range"></div><div class="label">Semana</div><div class="weeks" id="weeks"></div><section id="meals"><div class="label">Día</div><div class="days" id="days"></div><div id="meal"></div></section><section id="buy" class="hidden"><div class="label">Supermercado</div><div class="stores" id="stores"></div><div class="shop-head"><strong id="storeTitle"></strong><span>Toda la lista corresponde únicamente a este supermercado.</span></div><div class="progress" id="progress"></div><div class="shopping" id="shopping"></div></section></main><nav class="nav"><button id="mealBtn" class="active">Comidas</button><button id="buyBtn">Compra</button></nav><script src="./data.js?v=5"></script><script src="./products.js?v=2"></script><script>const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];let s={w:0,d:0,store:localStorage.getItem('food-supermarket')||'Mercadona'};const $=x=>document.getElementById(x),date=x=>new Date(x+'T12:00:00'),esc=x=>String(x).replace(/[&<>\"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[a]));function range(w){let a=date(w.start),b=date(w.end);return a.getMonth()==b.getMonth()?`${a.getDate()}–${b.getDate()} de ${M[b.getMonth()]}`:`${a.getDate()} ${M[a.getMonth()]} – ${b.getDate()} ${M[b.getMonth()]}`}function weeks(){let e=$('weeks');e.innerHTML='';MEAL_DATA.weeks.forEach((w,i)=>{let b=document.createElement('button');b.className='week'+(i==s.w?' active':'');b.textContent=range(w);b.onclick=()=>{s.w=i;s.d=0;render()};e.appendChild(b)})}function days(){let e=$('days');e.innerHTML='';MEAL_DATA.weeks[s.w].days.forEach((x,i)=>{let d=date(x.date),b=document.createElement('button');b.className='day'+(i==s.d?' active':'');b.innerHTML=`<small>${D[d.getDay()].slice(0,3)}</small><b>${d.getDate()}</b>`;b.onclick=()=>{s.d=i;days();meal()};e.appendChild(b)})}function block(t,m){return `<article class="meal"><h2>${t}</h2><h3>${m.name}</h3>${m.items.map(x=>`<div class="ingredient"><span>${x.name}</span><span>${x.qty}</span></div>`).join('')}</article>`}function meal(){let w=MEAL_DATA.weeks[s.w],x=w.days[s.d],d=date(x.date);$('range').textContent=range(w);$('meal').innerHTML=`<div class="date">${D[d.getDay()][0].toUpperCase()+D[d.getDay()].slice(1)}, ${d.getDate()} de ${M[d.getMonth()]}</div><div class="meals">${block('Comida',x.lunch)}${block('Cena',x.dinner)}</div>`}function key(w,x){return `food-${w.start}-${x.category}-${x.name}-${s.store}`}function fallbackSvg(v){const color=s.store==='Mercadona'?'#2d9154':s.store==='Carrefour Express'?'#c91d2c':'#1555b0',txt=esc(v.name).slice(0,26),st=esc(s.store);return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260"><rect width="260" height="260" rx="28" fill="#171719"/><rect x="18" y="18" width="224" height="224" rx="24" fill="#f7f7f7"/><rect x="32" y="32" width="196" height="38" rx="19" fill="${color}"/><text x="130" y="57" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">${st}</text><text x="130" y="130" text-anchor="middle" font-size="50">🛒</text><text x="130" y="184" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#222">${txt}</text></svg>`)} `}function loadPhoto(img,v){let urls=(v.images||[]).filter(Boolean),i=0;const next=()=>{if(i<urls.length){img.src=urls[i++]}else{img.onerror=null;img.src=fallbackSvg(v)}};img.onerror=next;next()}function stores(){let e=$('stores');e.innerHTML='';STORES.forEach(st=>{let b=document.createElement('button');b.className='store-btn'+(st===s.store?' active':'');b.textContent=st;b.onclick=()=>{s.store=st;localStorage.setItem('food-supermarket',st);stores();shopping()};e.appendChild(b)});$('storeTitle').textContent=`Comprar en ${s.store}`}function shopping(){let w=MEAL_DATA.weeks[s.w],groups={};w.shopping.forEach(x=>(groups[x.category]||=[]).push(x));let e=$('shopping');e.innerHTML='';Object.entries(groups).forEach(([g,items])=>{let c=document.createElement('section');c.className='group';c.innerHTML=`<h2>${g}</h2>`;items.forEach(x=>{let v=getProduct(x.name,s.store),checked=localStorage.getItem(key(w,x))==='1',r=document.createElement('label');r.className='shop'+(checked?' done':'');r.innerHTML=`<input type="checkbox" ${checked?'checked':''}><span class="photo"><img loading="lazy" alt="${esc(v.name)}"></span><span><div class="name">${esc(v.name)}</div><div class="product">${esc(v.product||v.name)}</div><span class="store">${esc(s.store)}</span></span><span class="qty">${esc(x.qty)}</span>`;loadPhoto(r.querySelector('img'),v);let q=r.querySelector('input');q.onchange=()=>{localStorage.setItem(key(w,x),q.checked?'1':'0');r.classList.toggle('done',q.checked);progress()};c.appendChild(r)});e.appendChild(c)});progress();$('range').textContent=range(w);$('storeTitle').textContent=`Comprar en ${s.store}`}function progress(){let w=MEAL_DATA.weeks[s.w],n=w.shopping.filter(x=>localStorage.getItem(key(w,x))==='1').length;$('progress').textContent=`Comprado: ${n} / ${w.shopping.length}`}function render(){weeks();days();meal();stores();shopping()}function view(v){$('meals').classList.toggle('hidden',v!='m');$('buy').classList.toggle('hidden',v!='b');$('mealBtn').classList.toggle('active',v=='m');$('buyBtn').classList.toggle('active',v=='b');$('title').textContent=v=='m'?'Comidas':'Compra';if(v=='b'){stores();shopping()}scrollTo(0,0)}$('mealBtn').onclick=()=>view('m');$('buyBtn').onclick=()=>view('b');render();</script></body></html>
