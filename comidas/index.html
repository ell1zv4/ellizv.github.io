<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Comidas</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--surface:#121214;--surface2:#19191c;--line:#27272c;--text:#f5f5f7;--muted:#8d8d95;--soft:#c9c9cf;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:720px;margin:0 auto;padding:20px 14px calc(100px + var(--safe-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:3px 2px 20px}
h1{margin:0;font-size:34px;line-height:1;letter-spacing:-1.8px;font-weight:700}.range{margin-top:6px;color:var(--muted);font-size:13px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin:0 2px 9px}
.week-list,.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:0 1px 4px;margin:0 -1px 15px}.week-list::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.week{flex:0 0 auto;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 15px;border-radius:999px;font-size:14px;font-weight:650;scroll-snap-align:start}.week.active{background:var(--text);color:#0b0b0c;border-color:var(--text)}
.day{flex:0 0 62px;height:68px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:start}.day .dow{font-size:11px;text-transform:uppercase;font-weight:700}.day .num{font-size:20px;font-weight:700;line-height:1}.day.active{background:var(--surface2);color:var(--text);border-color:#48484f}.day.active .num{color:#fff}
.panel{touch-action:pan-y}.date-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}.date-title{font-size:20px;font-weight:700;letter-spacing:-.4px}.swipe-hint{font-size:11px;color:#5f5f66;white-space:nowrap}
.meals{display:flex;flex-direction:column;gap:10px}.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}.meal-label{font-size:11px;text-transform:uppercase;letter-spacing:1.25px;color:var(--muted);font-weight:750}.meal-name{font-size:22px;line-height:1.12;letter-spacing:-.55px;font-weight:700;margin:6px 0 15px}.item{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;min-height:47px;border-top:1px solid var(--line);font-size:15px}.item:first-of-type{border-top:0}.item-name{color:var(--soft)}.item-qty{font-weight:700;text-align:right;white-space:nowrap}
.shopping-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 13px}.shopping-title{font-size:20px;font-weight:700}.progress{font-size:13px;color:var(--muted)}.progress strong{color:var(--text)}
.shopping{display:flex;flex-direction:column;gap:10px}.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.group-title{padding:15px 16px 10px;font-size:13px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.shop-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}.shop-item input{appearance:none;width:22px;height:22px;border:1.5px solid #55555d;border-radius:7px;background:transparent;display:grid;place-items:center;margin:0}.shop-item input:checked{background:var(--text);border-color:var(--text)}.shop-item input:checked:after{content:"✓";color:#0b0b0c;font-size:15px;font-weight:900}.shop-name{color:var(--soft)}.shop-qty{font-weight:700;text-align:right;white-space:nowrap}.shop-item.done .shop-name{text-decoration:line-through;color:#5f5f65}.shop-item.done .shop-qty{color:#5f5f65}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:100%;max-width:720px;padding:8px 12px calc(8px + var(--safe-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(11,11,12,.92));}.bottom-inner{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:rgba(25,25,28,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 35px rgba(0,0,0,.35)}.nav-btn{height:52px;border:0;border-radius:13px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}.nav-btn.active{background:var(--text);color:#0b0b0c}.nav-icon{font-size:17px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:18px;background:var(--surface)}.error{color:#ff9c9c}
@media(min-width:700px){.app{padding-top:34px}.meal{padding:20px}.shopping{display:grid;grid-template-columns:1fr 1fr}.bottom-nav{max-width:460px;bottom:16px;padding:0}.bottom-inner{border-radius:20px}.app{padding-bottom:110px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div><h1 id="pageTitle">Comidas</h1><div class="range" id="currentRange"></div></div></header>

  <div class="section-title">Semana</div>
  <div class="week-list" id="weeks"></div>

  <section id="mealsView">
    <div class="section-title">Día</div>
    <div class="days" id="days"></div>
    <div id="mealPanel" class="panel"></div>
  </section>

  <section id="shoppingView" class="hidden">
    <div class="shopping-head"><div class="shopping-title">Lista de compra</div><div class="progress" id="progress"></div></div>
    <div class="shopping" id="shopping"></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Navegación principal">
  <div class="bottom-inner">
    <button class="nav-btn active" id="mealsTab"><span class="nav-icon">◻</span><span>Comidas</span></button>
    <button class="nav-btn" id="shoppingTab"><span class="nav-icon">✓</span><span>Compra</span></button>
  </div>
</nav>

<script src="./data.js?v=3"></script>
<script>
const monthNames=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const dayNames=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
let state={data:null,week:0,day:0,view:"meals"};
let touchStartX=0,touchStartY=0;
const $=id=>document.getElementById(id);
function parseDate(s){return new Date(s+"T12:00:00")}
function shortRange(w){const a=parseDate(w.start),b=parseDate(w.end);if(a.getMonth()===b.getMonth())return `${a.getDate()}–${b.getDate()} de ${monthNames[b.getMonth()]}`;return `${a.getDate()} ${monthNames[a.getMonth()]} – ${b.getDate()} ${monthNames[b.getMonth()]}`}
function fullDate(s){const d=parseDate(s);return `${dayNames[d.getDay()][0].toUpperCase()+dayNames[d.getDay()].slice(1)}, ${d.getDate()} de ${monthNames[d.getMonth()]}`}
function setView(v){state.view=v;$('mealsTab').classList.toggle('active',v==='meals');$('shoppingTab').classList.toggle('active',v==='shopping');$('mealsView').classList.toggle('hidden',v!=='meals');$('shoppingView').classList.toggle('hidden',v!=='shopping');$('pageTitle').textContent=v==='meals'?'Comidas':'Compra';if(v==='shopping')renderShopping();window.scrollTo({top:0,behavior:'smooth'})}
function renderWeeks(){const box=$('weeks');box.innerHTML='';state.data.weeks.forEach((w,i)=>{const b=document.createElement('button');b.className='week'+(i===state.week?' active':'');b.textContent=shortRange(w);b.onclick=()=>{state.week=i;state.day=0;renderAll();requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))};box.appendChild(b)})}
function renderDays(){const box=$('days');box.innerHTML='';state.data.weeks[state.week].days.forEach((d,i)=>{const dt=parseDate(d.date),b=document.createElement('button');b.className='day'+(i===state.day?' active':'');b.innerHTML=`<span class="dow">${dayNames[dt.getDay()].slice(0,3)}</span><span class="num">${dt.getDate()}</span>`;b.onclick=()=>{state.day=i;renderDays();renderMeal();requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))};box.appendChild(b)})}
function mealBlock(label,meal){const items=meal.items.map(x=>`<div class="item"><span class="item-name">${x.name}</span><span class="item-qty">${x.qty}</span></div>`).join('');return `<article class="meal"><div class="meal-label">${label}</div><div class="meal-name">${meal.name}</div>${items}</article>`}
function renderMeal(){const w=state.data.weeks[state.week],d=w.days[state.day];$('currentRange').textContent=shortRange(w);$('mealPanel').innerHTML=`<div class="date-card"><div class="date-title">${fullDate(d.date)}</div><div class="swipe-hint">Desliza ↔</div></div><div class="meals">${mealBlock('Comida',d.lunch)}${mealBlock('Cena',d.dinner)}</div>`}
function checkKey(w,item){return `food-${w.start}-${item.category}-${item.name}`}
function updateProgress(){const w=state.data.weeks[state.week],items=w.shopping||[],done=items.filter(item=>localStorage.getItem(checkKey(w,item))==='1').length;$('progress').innerHTML=`<strong>${done}</strong> / ${items.length}`}
function renderShopping(){const w=state.data.weeks[state.week],groups={};(w.shopping||[]).forEach(item=>(groups[item.category]||=[]).push(item));const box=$('shopping');box.innerHTML='';Object.entries(groups).forEach(([category,items])=>{const group=document.createElement('section');group.className='group';group.innerHTML=`<div class="group-title">${category}</div>`;items.forEach(item=>{const key=checkKey(w,item),checked=localStorage.getItem(key)==='1',row=document.createElement('label');row.className='shop-item'+(checked?' done':'');row.innerHTML=`<input type="checkbox" ${checked?'checked':''}><span class="shop-name">${item.name}</span><span class="shop-qty">${item.qty}</span>`;const input=row.querySelector('input');input.onchange=()=>{localStorage.setItem(key,input.checked?'1':'0');row.classList.toggle('done',input.checked);updateProgress()};group.appendChild(row)});box.appendChild(group)});updateProgress();$('currentRange').textContent=shortRange(w)}
function moveDay(delta){const days=state.data.weeks[state.week].days,newDay=state.day+delta;if(newDay<0||newDay>=days.length)return;state.day=newDay;renderDays();renderMeal();requestAnimationFrame(()=>document.querySelector('.day.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))}
function renderAll(){renderWeeks();renderDays();renderMeal();renderShopping()}
function boot(){try{state.data=window.MEAL_DATA;if(!state.data?.weeks?.length)throw new Error('No hay semanas');const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const wi=state.data.weeks.findIndex(w=>today>=w.start&&today<=w.end);state.week=wi>=0?wi:0;if(wi>=0){const di=state.data.weeks[wi].days.findIndex(d=>d.date===today);state.day=di>=0?di:0}renderAll()}catch(e){$('mealPanel').innerHTML='<div class="empty error">No se han podido cargar las semanas.</div>'}}
$('mealsTab').onclick=()=>setView('meals');$('shoppingTab').onclick=()=>setView('shopping');
$('mealPanel').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});
$('mealPanel').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)moveDay(dx<0?1:-1)},{passive:true});
boot();
</script>
</body>
</html>
