<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Comidas</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--surface:#111113;--surface-2:#17171a;--line:#252529;--text:#f4f4f5;--muted:#8b8b92;--soft:#c7c7cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:30px 18px 70px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}h1{margin:0;font-size:clamp(38px,7vw,64px);line-height:.94;letter-spacing:-3px;font-weight:650}.meta{margin-top:10px;color:var(--muted);font-size:13px}.tabs{position:sticky;top:10px;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;margin-bottom:20px;border:1px solid var(--line);background:rgba(17,17,19,.86);backdrop-filter:blur(18px);border-radius:13px}.tab{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font-weight:600}.tab.active{background:var(--surface-2);color:var(--text)}.week-list{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:18px;scrollbar-width:none}.week-list::-webkit-scrollbar{display:none}.week{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:600}.week.active{background:var(--text);color:#0c0c0d;border-color:var(--text)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:10px 5px;font-size:12px;font-weight:600}.day.active{background:var(--surface-2);color:var(--text);border-color:#3a3a40}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:18px}.date-title{font-size:25px;font-weight:650;letter-spacing:-.8px}.meals{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal{border:1px solid var(--line);background:#0f0f11;border-radius:14px;padding:17px}.label{text-transform:uppercase;letter-spacing:1.25px;font-size:10px;font-weight:700;color:var(--muted)}.meal-name{margin:6px 0 13px;font-size:20px;font-weight:650;letter-spacing:-.35px}.item{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.item:first-of-type{border-top:0}.item-name{color:var(--soft)}.item-qty{font-weight:650;text-align:right;white-space:nowrap}.shopping{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}.group-title{font-size:15px;font-weight:650;margin-bottom:7px}.shop-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.shop-item:first-of-type{border-top:0}.shop-item input{width:17px;height:17px;accent-color:#f4f4f5}.shop-item.done .shop-name{text-decoration:line-through;color:#55555c}.shop-qty{font-weight:650;text-align:right;white-space:nowrap}.hidden{display:none!important}.empty{padding:34px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:16px}.error{color:#ff9c9c}@media(max-width:700px){.app{padding:24px 12px 55px}header{margin-bottom:22px}h1{letter-spacing:-2.2px}.days{grid-template-columns:repeat(4,1fr)}.meals,.shopping{grid-template-columns:1fr}.panel{padding:14px}.meal{padding:15px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>Comidas</h1><div class="meta" id="currentRange"></div></div></header>
<nav class="tabs"><button class="tab active" id="mealsTab">Comidas y cenas</button><button class="tab" id="shoppingTab">Qué comprar</button></nav>
<div class="week-list" id="weeks"></div>
<section id="mealsView"><div class="days" id="days"></div><div id="mealPanel"></div></section>
<section id="shoppingView" class="hidden"><div class="shopping" id="shopping"></div></section>
</main>
<script src="./data.js?v=2"></script>
<script>
const monthNames=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const dayNames=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
let state={data:null,week:0,day:0,view:"meals"};
function parseDate(s){return new Date(s+"T12:00:00")}
function shortRange(w){const a=parseDate(w.start),b=parseDate(w.end);if(a.getMonth()===b.getMonth())return `${a.getDate()}–${b.getDate()} ${monthNames[b.getMonth()]}`;return `${a.getDate()} ${monthNames[a.getMonth()]} – ${b.getDate()} ${monthNames[b.getMonth()]}`}
function fullDate(s){const d=parseDate(s);return `${dayNames[d.getDay()][0].toUpperCase()+dayNames[d.getDay()].slice(1)}, ${d.getDate()} de ${monthNames[d.getMonth()]}`}
function shortDay(s){const d=parseDate(s);return dayNames[d.getDay()].slice(0,3)}
function setView(v){state.view=v;document.getElementById("mealsTab").classList.toggle("active",v==="meals");document.getElementById("shoppingTab").classList.toggle("active",v==="shopping");document.getElementById("mealsView").classList.toggle("hidden",v!=="meals");document.getElementById("shoppingView").classList.toggle("hidden",v!=="shopping")}
function renderWeeks(){const box=document.getElementById("weeks");box.innerHTML="";state.data.weeks.forEach((w,i)=>{const b=document.createElement("button");b.className="week"+(i===state.week?" active":"");b.textContent=shortRange(w);b.onclick=()=>{state.week=i;state.day=0;renderAll()};box.appendChild(b)})}
function renderDays(){const box=document.getElementById("days");box.innerHTML="";const days=state.data.weeks[state.week].days;days.forEach((d,i)=>{const b=document.createElement("button");b.className="day"+(i===state.day?" active":"");const dt=parseDate(d.date);b.textContent=`${shortDay(d.date)} ${dt.getDate()}`;b.onclick=()=>{state.day=i;renderDays();renderMeal()};box.appendChild(b)})}
function mealBlock(label,meal){const items=meal.items.map(x=>`<div class="item"><span class="item-name">${x.name}</span><span class="item-qty">${x.qty}</span></div>`).join("");return `<article class="meal"><div class="label">${label}</div><div class="meal-name">${meal.name}</div>${items}</article>`}
function renderMeal(){const w=state.data.weeks[state.week],d=w.days[state.day];document.getElementById("currentRange").textContent=shortRange(w);document.getElementById("mealPanel").innerHTML=`<div class="panel"><div class="day-head"><div><div class="date-title">${fullDate(d.date)}</div></div></div><div class="meals">${mealBlock("Comida",d.lunch)}${mealBlock("Cena",d.dinner)}</div></div>`}
function checkKey(w,item){return `food-${w.start}-${item.category}-${item.name}`}
function renderShopping(){const w=state.data.weeks[state.week],groups={};(w.shopping||[]).forEach(item=>{(groups[item.category]||=[]).push(item)});const box=document.getElementById("shopping");box.innerHTML="";Object.entries(groups).forEach(([category,items])=>{const group=document.createElement("section");group.className="group";group.innerHTML=`<div class="group-title">${category}</div>`;items.forEach(item=>{const key=checkKey(w,item),checked=localStorage.getItem(key)==="1",row=document.createElement("label");row.className="shop-item"+(checked?" done":"");row.innerHTML=`<input type="checkbox" ${checked?"checked":""}><span class="shop-name">${item.name}</span><span class="shop-qty">${item.qty}</span>`;const input=row.querySelector("input");input.onchange=()=>{localStorage.setItem(key,input.checked?"1":"0");row.classList.toggle("done",input.checked)};group.appendChild(row)});box.appendChild(group)})}
function renderAll(){renderWeeks();renderDays();renderMeal();renderShopping()}
function boot(){try{state.data=window.MEAL_DATA;if(!state.data?.weeks?.length)throw new Error("No hay semanas");const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;const idx=state.data.weeks.findIndex(w=>today>=w.start&&today<=w.end);state.week=idx>=0?idx:0;renderAll()}catch(e){document.getElementById("mealPanel").innerHTML=`<div class="empty error">No se han podido cargar las semanas.</div>`}}
document.getElementById("mealsTab").onclick=()=>setView("meals");document.getElementById("shoppingTab").onclick=()=>setView("shopping");boot();
</script>
</body>
</html>
